<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d6b5e">
  <meta name="description" content="RxCalc — podręczny kalkulator dawek i opakowań dla lekarzy i lekarzy weterynarii. Stomatologia, kardiologia, weterynaria i zapis dawkowania. Obliczenia na Twoim urządzeniu.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <script src="./theme-init.js" blocking="render" fetchpriority="high"></script>
  <title>RxCalc — kalkulator dawkowania</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./patient-picker.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a href="#main" class="skip-link">Przejdź do kalkulatora</a>
  <div id="app"><div class="boot" role="status" aria-live="polite"><span class="boot-mark"><img src="./icons/icon.svg" width="512" height="512" alt="" fetchpriority="high"></span><span class="boot-name" aria-hidden="true">Rx<span>Calc</span></span><p>Uruchamianie kalkulatora…</p><span class="boot-progress" aria-hidden="true"></span></div></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <noscript>RxCalc wymaga włączonego JavaScript. Włącz JavaScript w przeglądarce, aby korzystać z obliczeń.</noscript>
</body>
</html>
